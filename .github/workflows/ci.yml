name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run tests
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST}" ] || [ -z "${SERVER_USER}" ] || [ -z "${SERVER_SSH_KEY}" ]; then
            echo "SERVER_HOST, SERVER_USER and SERVER_SSH_KEY secrets are required."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/t-loyalty-deploy
          chmod 600 ~/.ssh/t-loyalty-deploy

          SERVER_PORT="${SERVER_PORT:-22}"
          ssh-keyscan -p "${SERVER_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/t-loyalty-hub}"
          REMOTE_DEPLOY_PATH="$(printf '%q' "${DEPLOY_PATH}")"

          ssh -i ~/.ssh/t-loyalty-deploy -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "DEPLOY_PATH=${REMOTE_DEPLOY_PATH} bash -s" <<'REMOTE'
            set -euo pipefail

            cd "${DEPLOY_PATH}"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
              else
                cat > .env <<'ENV'
SERVICE_NAME=t-loyalty-backend
APP_TITLE=T-Loyalty Backend Core
APP_VERSION=0.1.0
API_PREFIX=/api
DATA_DIR=/app/data
CORS_ORIGINS=http://localhost:3000
VITE_API_BASE_URL=/api
ENV
              fi
            fi

            docker compose up -d --build
            docker image prune -f
            docker compose ps
REMOTE
